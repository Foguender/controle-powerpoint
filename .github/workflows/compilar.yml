name: Gerar Controle PPT (PC e Celular)
on: [push]

jobs:
  # --- GERADOR DO COMPLEMENTO DO WINDOWS (PENDRIVE) ---
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias do PC
      run: |
        pip install pyinstaller flask pyautogui

    - name: Criar Arquivo EXE
      run: |
        pyinstaller --onefile controle.py

    - name: Guardar EXE do Pendrive
      uses: actions/upload-artifact@v4
      with:
        name: programa-do-pendrive
        path: dist/controle.exe

  # --- GERADOR DO APLICATIVO ANDROID (APK) ---
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Inicializar Configuracao do Android
      run: |
        gradle init --type basic --dsl groovy --incubating
        gradle wrapper

    - name: Criar APK do Celular
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Guardar APK do Celular
      uses: actions/upload-artifact@v4
      with:
        name: aplicativo-do-celular
        path: app/build/outputs/apk/debug/app-debug.apk
