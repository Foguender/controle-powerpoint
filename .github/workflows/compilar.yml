name: Gerar Controle PPT (PC e Celular)
on: [push]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Instalar Ferramentas PC
      run: |
        pip install pyinstaller flask pyautogui
    - name: Criar EXE
      run: |
        pyinstaller --onefile controle.py
    - name: Guardar EXE do Pendrive
      uses: actions/upload-artifact@v4
      with:
        name: programa-do-pendrive
        path: dist/controle.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Criar APK do Celular
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Guardar APK do Celular
      uses: actions/upload-artifact@v4
      with:
        name: aplicativo-do-celular
        path: app/build/outputs/apk/debug/app-debug.apk

